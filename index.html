<style>
:root{--bg:#f5eeff;--c:#fdfaff;--t:#2d2d3f;--t2:#7c7c8a;--b:#e9d5ff;--p:#8b5cf6;--s:#10b981;--w:#f59e0b;--d:#ef4444;--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);font-size:14px;padding:16px 16px 80px;min-height:100vh}
h1{font-size:22px;font-weight:800;margin-bottom:2px}
.sub{font-size:13px;color:var(--t2);margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:14px;margin-bottom:12px}
.c1{text-align:center;padding:12px 8px;border-radius:var(--r);cursor:pointer}
.c1 i{font-size:20px;display:block;margin-bottom:4px}
.c1 b{font-size:26px;display:block}.c1 s{font-size:11px;color:var(--t2)}
.bh{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;position:relative;overflow:hidden;border-bottom:1px solid var(--b);min-height:44px}
.row:last-child{border:none}
.ri{display:flex;align-items:center;gap:8px;width:100%;padding:8px 0;background:var(--c);position:relative;z-index:2;transition:transform .2s;flex-shrink:0}
.sdb{position:absolute;right:0;top:0;bottom:0;width:70px;background:var(--d);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;z-index:1;cursor:pointer}
.chk{width:18px;height:18px;border:2px solid var(--b);border-radius:6px;flex-shrink:0;cursor:pointer;margin-left:4px}
.chk.done{background:var(--s);border-color:var(--s);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
.inf{flex:1;min-width:0}.ti{font-size:13px;font-weight:500}.ti.done{text-decoration:line-through;color:var(--t2)}
.meta{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.tag{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:500}
.t-h{background:#fef2f2;color:#dc2626}.t-m{background:#eff6ff;color:#2563eb}.t-l{background:#f3f4f6;color:#6b7280}.t-d{background:#f0fdf4;color:#16a34a}.t-p{background:#f3e8ff;color:#7c3aed}.t-w{background:#fff7ed;color:#ea580c}
.inp{display:flex;gap:6px}.inp input{flex:1;padding:10px 12px;border:1px solid var(--b);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:var(--c)}
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--p);color:white}.btn-o{background:none;border:1px solid var(--b);color:var(--t2);border-radius:8px}
.wk-proj textarea{outline:none}.wk-proj textarea:focus{box-shadow:0 0 0 2px var(--p)}.wk-proj input:focus{box-shadow:0 0 0 2px var(--p)}
.em{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:100;align-items:center;justify-content:center;padding:16px}
.em>div{background:white;border-radius:var(--r);padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.em label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-top:10px}
.em input,.em select,.em textarea{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;font-size:13px;font-family:inherit;margin-top:3px;outline:none}
.flex{display:flex;gap:10px}.flex>*{flex:1}
.nav{display:flex;justify-content:space-around;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--b);padding:8px 0;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#a78bfa;font-size:10px;gap:2px;padding:4px 8px;border-radius:8px}
.nav a.sel{color:var(--p);font-weight:600}.nav a span:first-child{font-size:20px}
.progress{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin:8px 0}.progress>div{height:100%;border-radius:4px}
.timeline{padding:8px 0 4px;font-size:13px;font-weight:600;color:var(--p);border-bottom:2px solid var(--b);margin:8px 0 4px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--p);color:white;padding:8px 16px;border-radius:20px;font-size:12px;z-index:200;opacity:0;transition:opacity .3s}.toast.show{opacity:1}
.pb-stages{display:flex;justify-content:space-between;margin:12px 0 8px;padding:0 10px}
.pb-stage{font-size:11px;color:var(--t2)}.pb-row{display:flex;align-items:center;margin-bottom:8px;gap:8px}
.pb-track{flex:1;display:flex;justify-content:space-between;position:relative;padding:0 10px}
.pb-track:before{content:'';position:absolute;left:10px;right:10px;height:2px;background:var(--b);top:50%;transform:translateY(-50%);z-index:0}
.pb-dot{width:12px;height:12px;border-radius:50%;position:relative;z-index:1}
.overdue-bar{background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:8px;margin-bottom:10px;font-size:12px;display:none}
.cl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
</style>

<script>
function L(k){return JSON.parse(localStorage.getItem('wb_'+k)||'[]')}
function LS(k,v){localStorage.setItem('wb_'+k,JSON.stringify(v))}
function TT(){return L('tasks')}function ST(v){LS('tasks',v)}
function PP(){return L('projects')}function SP(v){LS('projects',v)}
function CC(){return L('courses')}function SC(v){LS('courses',v)}
function II(){return L('inbox')}function SI(v){LS('inbox',v)}
function UD(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function TD(){return new Date().toISOString().slice(0,10)}
function F(d){if(!d)return'';var p=d.split('-');return p[1]+'月'+p[2]+'日'}
function FS(d){if(!d)return'';var p=d.split('-');return p[1]+'/'+p[2]}
function C(s){return document.querySelector(s)}
function CL(s){return document.querySelectorAll(s)}
function TO(m){var t=C('#toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
var cf='全部',pg=0;

function SW(n,t){
  CL('.nav a').forEach(function(a){a.classList.remove('sel')});t.classList.add('sel');
  ['pg-home','pg-tasks','pg-projects','pg-courses','pg-acc','pg-report'].forEach(function(id,i){C('#'+id).style.display=i===n?'block':'none'});
  pg=n;RN();
}

function RN(){
  var ts=TT(),ps=PP(),cs=CC(),ix=II(),tday=TD();
  C('#today').textContent=F(tday)+' · '+['周日','周一','周二','周三','周四','周五','周六'][new Date().getDay()];
  var pjSel=C('#epj');pjSel.innerHTML='<option value="">不关联</option>';
  ps.forEach(function(p){pjSel.innerHTML+='<option value="'+p.id+'">'+p.name+'</option>';});

  if(pg===0){
    var todo=ts.filter(function(t){return t.status!=='已完成';});
    var done=ts.filter(function(t){return t.status==='已完成';});
    var risk=ts.filter(function(t){return t.risk&&t.status!=='已完成';});
    var ap=ps.filter(function(p){return p.status!=='已结束';});
    C('#dash').innerHTML=
      '<div class="c1 card"><i>📁</i><b style="color:var(--p)">'+ap.length+'</b><s>进行中项目</s></div>'+
      '<div class="c1 card" onclick="SW(1,CL(\'.nav a\')[1])"><i>📋</i><b style="color:var(--w)">'+todo.length+'</b><s>待办</s></div>'+
      '<div class="c1 card"><i>⚠️</i><b style="color:var(--d)">'+risk.length+'</b><s>风险</s></div>'+
      '<div class="c1 card"><i>✅</i><b style="color:var(--s)">'+done.length+'</b><s>已完成</s></div>';
    C('#t3list').innerHTML=(function(){
      var t3=ts.filter(function(t){return t.top3&&t.status!=='已完成';}).slice(0,3);
      if(!t3.length)return'<div style="padding:10px;text-align:center;color:var(--t2);font-size:12px">还没有 Top3</div>';
      return t3.map(function(t,i){return TK(t,i+1);}).join('');
    })();
    // 进度看板
    C('#pboard').innerHTML=(function(){
      if(!ps.length)return'<div style="padding:10px;text-align:center;color:var(--t2);font-size:12px">暂无项目</div>';
      var stages=['筹备','执行中','收尾','已完成'];
      var h='<div class="pb-stages">'+stages.map(function(s){return'<span class="pb-stage">'+s+'</span>';}).join('')+'</div>';
      ps.forEach(function(p){
        var si=stages.indexOf(p.phase||'筹备');if(si<0)si=0;
        h+='<div class="pb-row"><span style="font-size:11px;width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.name+'</span><div class="pb-track">';
        stages.forEach(function(s,i){
          var bg=i<si?'var(--s)':i===si?'var(--w)':'var(--b)';
          h+='<div class="pb-dot" style="background:'+bg+(i===si?';box-shadow:0 0 0 4px rgba(245,158,11,0.2)':'')+'"></div>';
        });
        h+='</div></div>';
      });
      return h;
    })();
  }

  if(pg===1){
    var fts=ts;
    if(cf==='待办')fts=ts.filter(function(t){return t.status!=='已完成'&&(!t.start||t.start>tday);});
    else if(cf==='进行中')fts=ts.filter(function(t){return t.status!=='已完成'&&t.start&&t.start<=tday;});
    else if(cf==='已完成')fts=ts.filter(function(t){return t.status==='已完成';});
    C('#tc').textContent=fts.length;
    var ov=fts.filter(function(t){return t.due&&t.due<tday&&t.status!=='已完成';});
    var ob=C('#ovbar');
    if(ov.length&&cf==='全部'){ob.style.display='block';ob.innerHTML='⏰ 即将逾期 '+ov.length+' 项 · '+ov.map(function(t){return t.title.substr(0,12)+'…';}).join(' | ');}
    else{ob.style.display='none';}
    var gr={};fts.forEach(function(t){var k=t.start||t.due||'无日期';if(!gr[k])gr[k]=[];gr[k].push(t);});
    var h='';Object.keys(gr).sort().forEach(function(k){
      if(k!=='无日期')h+='<div class="timeline">'+k+' · '+gr[k].length+'项</div>';
      gr[k].forEach(function(t){h+=TK(t);});
    });
    C('#tlist').innerHTML=h||'<div style="padding:20px;text-align:center;color:var(--t2)">没有任务</div>';
  }

  if(pg===2){
    C('#pjc').textContent=ps.length;
    // 进度看板
    C('#pboard2').innerHTML=(function(){
      if(!ps.length)return'<div class="card"><div style="padding:10px;text-align:center;color:var(--t2);font-size:12px">暂无项目</div></div>';
      var stages=['筹备','执行中','收尾','已完成'];
      var h='<div class="card"><div class="bh">🎯 进度看板</div><div class="pb-stages">'+stages.map(function(s){return'<span class="pb-stage">'+s+'</span>';}).join('')+'</div>';
      ps.forEach(function(p){
        var si=stages.indexOf(p.phase||'筹备');if(si<0)si=0;
        h+='<div class="pb-row"><span style="font-size:11px;width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.name+'</span><div class="pb-track">';
        stages.forEach(function(s,i){
          var bg=i<si?'var(--s)':i===si?'var(--w)':'var(--b)';
          h+='<div class="pb-dot" style="background:'+bg+(i===si?';box-shadow:0 0 0 4px rgba(245,158,11,0.2)':'')+'"></div>';
        });
        h+='</div></div>';
      });
      return h+'</div>';
    })();
    var ph='';
    ps.forEach(function(p){
      var pt=ts.filter(function(t){return t.pj===p.id;});
      var pd=pt.filter(function(t){return t.status==='已完成';}).length;
      var pr=pt.filter(function(t){return t.risk&&t.status!=='已完成';}).length;
      var tot=pt.length,pct=tot?Math.round(pd/tot*100):0;
      ph+='<div class="card">'+
        '<div style="font-weight:600;font-size:14px;margin-bottom:6px">'+p.name+'</div>'+
        '<div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap">'+
          '<span class="tag t-m">'+p.type+'</span><span class="tag">'+(p.phase||'')+'</span><span class="tag t-m">'+p.status+'</span>'+
        '</div>'+
        '<div class="progress"><div style="width:'+pct+'%;background:'+(pct>=80?'var(--s)':pct>=40?'var(--p)':'var(--w)')+'"></div></div>'+
        '<div style="font-size:11px;color:var(--t2);margin-bottom:8px">'+pct+'% · 待办'+(tot-pd)+' · 风险'+pr+' · '+(p.client||'')+'</div>'+
        (p.next?'<div style="background:#f3e8ff;padding:8px;border-radius:8px;font-size:11px;color:var(--p);margin-bottom:8px"><b>下一步：</b>'+p.next+'</div>':'')+
        '<div style="display:flex;gap:6px"><button class="btn btn-o" style="font-size:11px" onclick="EP(\''+p.id+'\')">✏️ 编辑</button><button class="btn btn-o" style="font-size:11px;color:var(--d)" onclick="DP(\''+p.id+'\')">🗑 删除</button></div>'+
      '</div>';
    });
    C('#pjlist').innerHTML=ph||'<div style="padding:20px;text-align:center;color:var(--t2)">没有项目</div>';
  }

  if(pg===3){
    C('#crc').textContent=cs.length;
    var cols={'研发中':[],'试用':[],'定稿':[]};
    cs.forEach(function(c){var k=c.status==='迭代中'?'定稿':c.status;if(cols[k])cols[k].push(c);});
    var ch='';
    ['研发中','试用','定稿'].forEach(function(st,i){
      var items=cols[st]||[];
      var clr=['#b45309','#2563eb','#16a34a'][i];
      ch+='<div class="card"><div style="font-weight:600;font-size:13px;padding-bottom:8px;border-bottom:1px solid var(--b);margin-bottom:8px;border-top:3px solid '+clr+';padding-top:8px">'+['🟡','🔵','🟢'][i]+' '+st+' <span style="font-weight:400;color:var(--t2)">'+items.length+'</span></div>';
      if(!items.length)ch+='<div style="padding:8px;text-align:center;color:var(--t2);font-size:12px">无</div>';
      items.forEach(function(c){
        ch+='<div style="padding:8px 0;border-bottom:1px solid var(--b)">'+
          '<div style="font-weight:600;font-size:13px">'+c.name+'</div>'+
          '<div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">'+
            (c.subject?'<span class="tag t-m">'+c.subject+'</span>':'')+
            '<span class="tag '+(c.slides?'t-d':'')+'" style="'+(c.slides?'':'opacity:.4')+'">'+(c.slides?'📑课件':'📑')+'</span>'+
            '<span class="tag '+(c.plan?'t-d':'')+'" style="'+(c.plan?'':'opacity:.4')+'">'+(c.plan?'📝教案':'📝')+'</span>'+
            '<span class="tag '+(c.ws?'t-d':'')+'" style="'+(c.ws?'':'opacity:.4')+'">'+(c.ws?'📄学习单':'📄')+'</span>'+
          '</div>'+
          '<div style="display:flex;gap:4px;margin-top:6px"><button class="btn btn-o" style="font-size:10px" onclick="EC(\''+c.id+'\')">✏️</button><button class="btn btn-o" style="font-size:10px;color:var(--d)" onclick="DC(\''+c.id+'\')">🗑</button></div>'+
        '</div>';
      });
      ch+='</div>';
    });
    C('#crlist').innerHTML=ch||'<div style="padding:20px;text-align:center;color:var(--t2)">没有课程</div>';
  }

  if(pg===5){renderCal();REP();WK();applyView();}
  if(pg===4){renderBills();}
}

function TK(t,num){
  var ho=t.status!=='已完成'&&t.start&&t.start<=TD();
  var pcl=t.priority==='高'?'t-h':t.priority==='中'?'t-m':'t-l';
  var stDisplay=t.status==='已完成'?'已完成':ho?'进行中':'待办';
  var scl=t.status==='已完成'?'t-d':ho?'t-m':'t-l';
  return '<div class="row">'+
    '<div class="sdb" onclick="DEL2(\''+t.id+'\')">删除</div>'+
    '<div class="ri" onclick="ET(\''+t.id+'\')">'+
    '<div class="chk'+(t.status==='已完成'?' done':'')+'" onclick="event.stopPropagation();TG(\''+t.id+'\')">'+(t.status==='已完成'?'✓':'')+'</div>'+
    '<div class="inf"><div class="ti'+(t.status==='已完成'?' done':'')+'">'+(num?'<b style="color:var(--d)">'+num+'. </b>':'')+t.title+'</div>'+
    '<div class="meta"><span class="tag '+pcl+'">'+t.priority+'</span><span class="tag '+scl+'">'+stDisplay+'</span>'+
    (t.start?'<span style="font-size:10px;color:var(--t2)">'+FS(t.start):'')+(t.due?'→'+FS(t.due)+'</span>':'')+
    (t.assignee?'<span style="font-size:10px;color:var(--t2)">👤'+t.assignee+'</span>':'')+
    (t.risk?'<span class="tag t-h">⚠️</span>':'')+(t.ms?'<span class="tag t-p">📍</span>':'')+'</div></div>'+
    '<span style="font-size:10px;color:var(--t2);flex-shrink:0">'+(t.start?FS(t.start):t.due?FS(t.due):'')+'</span>'+
    '<button onclick="event.stopPropagation();DEL2(\''+t.id+'\')" style="border:none;background:none;color:var(--d);cursor:pointer;font-size:14px;opacity:0;padding:0 4px">🗑</button>'+
  '</div></div>';
}
function IX(x,i){
  return '<div class="row">'+
    (x.done?'<span style="font-size:11px;color:var(--t2);background:var(--bg);padding:2px 8px;border-radius:8px;flex-shrink:0">✓ 已处理</span>':
    '<span style="font-size:11px;color:var(--w);background:#fff7ed;padding:2px 8px;border-radius:8px;flex-shrink:0">⏳ 待处理</span>')+
    '<div class="inf"><div class="ti">'+x.content+'</div></div>'+
    (x.done?'<button onclick="DIX('+i+')" style="border:none;background:none;color:var(--d);cursor:pointer;font-size:16px">🗑</button>':
    '<button onclick="CIX('+i+')" style="border:none;background:var(--p);color:white;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer">转任务</button>'+
    '<button onclick="AIX('+i+')" style="border:none;background:var(--b);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer">归档</button>')+
  '</div>';
}

// Tasks
function ET(id){
  C('#eid').value='';['en','ed','ea','eco'].forEach(function(x){C('#'+x).value='';});C('#ep').value='低';
  C('#es').value='待办';C('#estart').value='';C('#edue').value='';C('#epj').value='';
  C('#et3').checked=false;C('#erisk').checked=false;C('#ems').checked=false;C('#delbtn').style.display='none';CE('em-task');
  if(id){var t=TT().find(function(x){return x.id===id;});if(!t)return;
    C('#emtt').textContent='编辑任务';C('#eid').value=t.id;C('#en').value=t.title;C('#ed').value=t.desc||'';
    C('#ep').value=t.priority||'低';C('#es').value=t.status||'待办';C('#estart').value=t.start||'';C('#edue').value=t.due||'';
    C('#ea').value=t.assignee||'';C('#eco').value=t.collab||'';C('#epj').value=t.pj||'';
    C('#et3').checked=!!t.top3;C('#erisk').checked=!!t.risk;C('#ems').checked=!!t.ms;C('#delbtn').style.display='block';
  }else{C('#emtt').textContent='新建任务';}
  C('#em-task').style.display='flex';
}
function SE(){var id=C('#eid').value,ts=TT();
  var d={id:id||UD(),title:C('#en').value.trim(),desc:C('#ed').value.trim(),priority:C('#ep').value,
    status:C('#es').value,start:C('#estart').value,due:C('#edue').value,assignee:C('#ea').value.trim(),
    collab:C('#eco').value.trim(),pj:C('#epj').value||'',top3:C('#et3').checked,risk:C('#erisk').checked,
    ms:C('#ems').checked,doneDate:C('#es').value==='已完成'?TD():''};
  if(!d.title){alert('标题不能为空');return;}
  if(id){var i=ts.findIndex(function(x){return x.id===id;});if(i>=0){d.createdAt=ts[i].createdAt;ts[i]=d;}}
  else{d.createdAt=TD();ts.push(d);}ST(ts);CE();RN();}
function TG(id){var ts=TT(),t=ts.find(function(x){return x.id===id;});if(!t)return;t.status=t.status==='已完成'?'待办':'已完成';t.doneDate=t.status==='已完成'?TD():'';ST(ts);RN();}
function DEL(){if(!confirm('删除？'))return;var id=C('#eid').value;ST(TT().filter(function(x){return x.id!==id;}));CE();RN();}
function DEL2(id){if(!confirm('删除？'))return;ST(TT().filter(function(x){return x.id!==id;}));RN();}
function FL(f,t){cf=f;CL('#tfilter .btn').forEach(function(b){b.classList.remove('sel')});t.classList.add('sel');RN();}

// Projects
function EP(id){
  C('#peid').value='';['pen','pecl','penx','peno'].forEach(function(x){C('#'+x).value='';});

function dedupTasks(){

  });

  });
